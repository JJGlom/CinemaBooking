<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="container mt-5">

        <div th:if="${param.expired}" class="alert alert-warning text-center">
            Twój czas na dokończenie rezerwacji (1 minuta) minął. Miejsca zostały zwolnione.
        </div>

        <div th:if="${secondsRemaining != null and secondsRemaining > 0}" class="alert alert-info text-center fw-bold">
            Pozostały czas na rezerwację: <span id="timer" class="text-danger fs-4">01:00</span>
        </div>

        <div class="card shadow-lg border-info" th:if="${not #lists.isEmpty(tickets)}">
            <div class="card-header text-center bg-dark text-info">
                <h3>TWÓJ KOSZYK</h3>
            </div>
            <div class="card-body bg-dark text-white">
                <table class="table table-dark table-hover">
                    <thead>
                    <tr>
                        <th>Film</th>
                        <th>Sala</th>
                        <th>Miejsce</th>
                        <th>Typ</th>
                        <th>Cena</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${ticket.screening.movie.title}">Tytuł</td>
                        <td th:text="${ticket.screening.room.name}">Sala</td>
                        <td>Rząd <span th:text="${ticket.seat.rowNumber}"></span>, M <span th:text="${ticket.seat.seatNumber}"></span></td>
                        <td th:text="${ticket.type}">NORMAL</td>
                        <td th:text="${ticket.price} + ' PLN'">25.00 PLN</td>
                    </tr>
                    </tbody>
                </table>
                <h3 class="text-end text-warning mt-3">SUMA: <span th:text="${totalPrice} + ' PLN'"></span></h3>

                <div class="d-flex justify-content-between gap-3 mt-4">
                    <a href="/booking/edit" class="btn btn-outline-warning">EDYTUJ MIEJSCA</a>

                    <div class="d-flex gap-3">
                        <a href="/booking/cancel" class="btn btn-outline-danger">ANULUJ ZAMÓWIENIE</a>
                        <button onclick="pay()" class="btn btn-success btn-lg">ZAPŁAĆ I POTWIERDŹ</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5" th:if="${#lists.isEmpty(tickets)}">
            <h3 class="text-muted">Twój koszyk jest pusty.</h3>
            <a href="/" class="btn btn-outline-info mt-3">WRÓĆ DO REPERTUARU</a>
        </div>
    </div>

    <script th:inline="javascript">
        const ticketIds = [[${ticketIds}]];

        let timeLeft = [[${secondsRemaining != null ? secondsRemaining : 0}]];

        if (timeLeft > 0) {
            const timerElement = document.getElementById('timer');
            const countdown = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    window.location.href = '/booking/cart?expired';
                } else {
                    timeLeft--;
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;
                    timerElement.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function pay() {
            if(!ticketIds || ticketIds.length === 0) return;

            fetch('/api/v1/bookings/pay', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(ticketIds)
            }).then(response => {
                if(response.ok) {
                    const idsParam = ticketIds.join(',');
                    window.location.href = `/booking/success?ids=${idsParam}`;
                } else {
                    alert('Błąd płatności');
                }
            });
        }
    </script>
</div>
</body>
</html>
