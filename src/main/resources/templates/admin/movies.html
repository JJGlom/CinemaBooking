<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="color: #66fcf1; text-transform: uppercase;">Zarządzanie Filmami</h2>
            <a href="/admin/movies/add" class="btn btn-outline-success">DODAJ NOWY FILM</a>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-hover" style="border: 1px solid #45a29e;">
                <thead>
                <tr style="color: #66fcf1;">
                    <th>ID</th>
                    <th>Plakat</th>
                    <th>Tytuł</th>
                    <th>Gatunek</th>
                    <th>Czas</th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="movie : ${movies}">
                    <td th:text="${movie.id}">1</td>
                    <td>
                        <img th:if="${movie.posterUrl}" th:src="${movie.posterUrl}" style="height: 50px;">
                    </td>
                    <td>
                        <a th:href="@{/movies/{id}(id=${movie.id})}" class="text-white text-decoration-none fw-bold" th:text="${movie.title}">Tytuł</a>
                    </td>
                    <td th:text="${movie.genre}">Gatunek</td>
                    <td th:text="${movie.durationMinutes} + ' min'">120 min</td>
                    <td>
                        <a th:href="@{/admin/movies/edit/{id}(id=${movie.id})}" class="btn btn-sm btn-warning">EDYTUJ</a>
                        <a th:href="@{/admin/movies/delete/{id}(id=${movie.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Czy na pewno usunąć ten film?');">USUŃ</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
