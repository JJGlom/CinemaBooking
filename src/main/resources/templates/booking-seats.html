<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::content})}">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:fragment="content">
    <div class="container text-center">
        <h2 class="my-4" style="color: #66fcf1; text-transform: uppercase; letter-spacing: 3px;">Wybierz miejsca</h2>

        <div class="ticket-type-selector">
            <div class="type-option normal active" onclick="setTicketType('NORMAL')">
                <h5 class="mb-0">NORMALNY</h5>
                <small>25.00 PLN</small>
            </div>
            <div class="type-option reduced" onclick="setTicketType('REDUCED')">
                <h5 class="mb-0">ULGOWY</h5>
                <small>18.00 PLN</small>
            </div>
            <div class="type-option family" onclick="setTicketType('FAMILY')">
                <h5 class="mb-0">RODZINNY</h5>
                <small>15.00 PLN</small>
            </div>
        </div>

        <div class="screen-container perspective">
            <div class="screen">EKRAN</div>
        </div>

        <div id="seat-map" class="seat-grid mb-5">
            <div class="spinner-border text-info" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="fixed-bottom bg-dark p-3 border-top border-info text-center" style="background: rgba(11, 12, 16, 0.95);">
            <div class="container">
                <div id="summaryText" class="mb-2 text-white">Wybierz typ biletu powyżej, a następnie kliknij miejsca na mapie.</div>
                <button id="bookBtn" class="btn btn-lg px-5" disabled>
                    POTWIERDŹ REZERWACJĘ
                </button>
            </div>
        </div>

        <div id="alertPlaceholder" class="mt-3"></div>
    </div>

    <script th:inline="javascript">
        const screeningId = [[${screeningId}]];
        const apiUrl = `/api/v1/bookings/screening/${screeningId}/seats`;
        const bookUrl = `/api/v1/bookings/reserve`;

        let selectedSeats = new Map();
        let currentTicketType = 'NORMAL';
        const PRICES = {
            'NORMAL': 25.00,
            'REDUCED': 18.00,
            'FAMILY': 15.00
        };

        document.addEventListener('DOMContentLoaded', loadSeats);

        function setTicketType(type) {
            currentTicketType = type;
            document.querySelectorAll('.type-option').forEach(el => el.classList.remove('active'));
            document.querySelector(`.type-option.${type.toLowerCase()}`).classList.add('active');
        }

        function loadSeats() {
            fetch(apiUrl)
                .then(response => response.json())
                .then(seats => renderSeats(seats))
                .catch(error => showAlert('Błąd systemu', 'danger'));
        }

        function renderSeats(seats) {
            const container = document.getElementById('seat-map');
            container.innerHTML = '';

            const rows = {};
            seats.forEach(seat => {
                if (!rows[seat.rowNumber]) rows[seat.rowNumber] = [];
                rows[seat.rowNumber].push(seat);
            });

            Object.keys(rows).sort((a,b) => a - b).forEach(rowNum => {
                const rowContainer = document.createElement('div');
                rowContainer.className = 'seat-row-container';

                const leftIndicator = document.createElement('div');
                leftIndicator.className = 'row-indicator';
                leftIndicator.innerText = rowNum;
                rowContainer.appendChild(leftIndicator);

                const seatsDiv = document.createElement('div');
                seatsDiv.className = 'seat-row';

                rows[rowNum].sort((a,b) => a.seatNumber - b.seatNumber).forEach(seat => {
                    const seatDiv = document.createElement('div');
                    seatDiv.classList.add('seat');
                    seatDiv.dataset.id = seat.id;
                    seatDiv.innerText = seat.seatNumber;

                    if (!seat.available) {
                        seatDiv.classList.add('taken');
                    } else {
                        seatDiv.addEventListener('click', () => toggleSeat(seatDiv, seat.id));
                    }

                    seatsDiv.appendChild(seatDiv);
                });

                rowContainer.appendChild(seatsDiv);

                const rightIndicator = document.createElement('div');
                rightIndicator.classList.add('row-indicator');
                rightIndicator.innerText = rowNum;
                rowContainer.appendChild(rightIndicator);

                container.appendChild(rowContainer);
            });
        }

        function toggleSeat(element, id) {
            if (selectedSeats.has(id)) {
                selectedSeats.delete(id);
                element.className = 'seat';
            } else {
                selectedSeats.set(id, currentTicketType);
                element.className = `seat selected-${currentTicketType.toLowerCase()}`;
            }
            updateSummary();
        }

        function updateSummary() {
            const btn = document.getElementById('bookBtn');
            let total = 0;
            let count = 0;

            selectedSeats.forEach((type) => {
                total += PRICES[type];
                count++;
            });

            const summaryText = document.getElementById('summaryText');

            if (count > 0) {
                btn.disabled = false;
                btn.innerText = `REZERWUJ (${total.toFixed(2)} PLN)`;
                summaryText.innerText = `Wybrano ${count} miejsc.`;
            } else {
                btn.disabled = true;
                btn.innerText = 'POTWIERDŹ REZERWACJĘ';
                summaryText.innerText = 'Wybierz typ biletu powyżej, a następnie kliknij miejsca na mapie.';
            }
        }

        document.getElementById('bookBtn').addEventListener('click', () => {
            if (selectedSeats.size === 0) return;

            const ticketsList = [];
            selectedSeats.forEach((type, id) => {
                ticketsList.push({
                    seatId: id,
                    ticketType: type
                });
            });

            const bookingData = {
                screeningId: screeningId,
                tickets: ticketsList
            };

            fetch(bookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bookingData)
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = `/booking/cart`;
                } else {
                    throw new Error('Błąd transakcji');
                }
            })
            .catch(error => {
                showAlert('Jedno z miejsc jest już zajęte', 'danger');
            });
        });

        function showAlert(message, type) {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible bg-dark text-white border-${type}" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');
            document.getElementById('alertPlaceholder').innerHTML = '';
            document.getElementById('alertPlaceholder').append(wrapper);
        }
    </script>
</div>
</body>
</html>
